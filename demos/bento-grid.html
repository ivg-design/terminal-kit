<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TBentoGridLit Demo</title>
  <script src="../js/utils/accent-init.js"></script>
  <link rel="stylesheet" href="../css/theme/terminal.css">
  <style>
    :root { --font-mono: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace; }
    body {
      margin: 0;
      background: var(--terminal-black, #0a0a0a);
      color: var(--terminal-green, #00ff41);
      font-family: var(--font-mono);
      min-height: 100vh;
    }
    .page {
      max-width: 1220px;
      margin: 0 auto;
      padding: 24px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 32px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .crumb { color: var(--terminal-green-dim, #00cc33); font-size: 12px; margin-bottom: 18px; }
    .panel {
      border: 1px solid var(--terminal-gray-dark, #333);
      background: var(--terminal-gray-darkest, #1a1a1a);
      padding: 16px;
      margin-bottom: 16px;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      align-items: end;
    }
    label {
      display: grid;
      gap: 6px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--terminal-green-dim, #00cc33);
    }
    input {
      background: #111;
      border: 1px solid var(--terminal-gray-dark, #333);
      color: var(--terminal-green, #00ff41);
      height: 32px;
      padding: 0 8px;
      font-family: inherit;
    }
    .toggles {
      display: flex;
      gap: 16px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .toggles label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    t-bento {
      --bento-border: var(--terminal-gray-dark, #333);
      --bento-bg: color-mix(in srgb, var(--terminal-gray-darkest, #1a1a1a) 70%, transparent);
    }
    .tile {
      border: 1px solid var(--terminal-gray-dark, #333);
      background: #0f0f0f;
      padding: 12px;
      min-height: 100%;
    }
    .tile h3 {
      margin: 0 0 8px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .tile p {
      margin: 0;
      color: var(--terminal-green-dim, #00cc33);
      font-size: 12px;
      line-height: 1.45;
    }
    pre {
      margin: 0;
      padding: 10px;
      border: 1px solid var(--terminal-gray-dark, #333);
      background: #0b0b0b;
      color: var(--terminal-green, #00ff41);
      font-size: 11px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>TBentoGridLit</h1>
    <div class="crumb">&rarr; Components / Bento Grid</div>

    <section class="panel">
      <div class="controls">
        <label>Columns <input id="columns" type="number" min="1" max="24" value="12"></label>
        <label>Gap (px) <input id="gap" type="number" min="0" max="48" value="12"></label>
        <label>Row Height (px) <input id="rowHeight" type="number" min="20" max="300" value="96"></label>
        <label>Min Tile Width (px) <input id="minTileWidth" type="number" min="120" max="480" value="220"></label>
      </div>
      <div class="toggles">
        <label><input id="dense" type="checkbox"> Dense packing</label>
        <label><input id="responsive" type="checkbox"> Responsive auto-fit</label>
        <label><input id="outlined" type="checkbox" checked> Outlined tiles</label>
      </div>
    </section>

    <section class="panel">
      <t-bento id="bento" columns="12" gap="12" row-height="96" outlined dense>
        <div class="tile" id="tileA" col-span="4" row-span="2">
          <h3>System Status</h3>
          <p>Small metrics card with two-row emphasis.</p>
        </div>

        <div class="tile" id="tileB" col-span="8" row-span="3">
          <h3>Activity Stream</h3>
          <p>Primary content zone for timeline/chat/log style components.</p>
        </div>

        <div class="tile" id="tileC" col-span="6" row-span="2" md-col-span="12">
          <h3>Calendar</h3>
          <t-cal></t-cal>
        </div>

        <div class="tile" id="tileD" col-span="6" row-span="2" md-col-span="12">
          <h3>Quick Actions</h3>
          <t-menu style="display:block"></t-menu>
          <p>Use `setItemSpan()` to reshape this tile at runtime.</p>
        </div>
      </t-bento>
    </section>

    <section class="panel">
      <h2 style="margin:0 0 10px; font-size:14px; text-transform:uppercase; letter-spacing:.08em;">Runtime Layout Snapshot</h2>
      <pre id="layout"></pre>
    </section>
  </div>

  <script type="module">
    import '../js/components/TBentoGridLit.js';
    import '../js/components/TCalendarLit.js';
    import '../js/components/TMenuLit.js';

    const bento = document.getElementById('bento');
    const layout = document.getElementById('layout');

    const bindNumber = (id, prop) => {
      const input = document.getElementById(id);
      input.addEventListener('input', () => {
        bento[prop] = Number(input.value);
      });
      bento[prop] = Number(input.value);
    };

    const bindBool = (id, prop) => {
      const input = document.getElementById(id);
      input.addEventListener('change', () => {
        bento[prop] = input.checked;
      });
      bento[prop] = input.checked;
    };

    bindNumber('columns', 'columns');
    bindNumber('gap', 'gap');
    bindNumber('rowHeight', 'rowHeight');
    bindNumber('minTileWidth', 'minTileWidth');

    bindBool('dense', 'dense');
    bindBool('responsive', 'responsive');
    bindBool('outlined', 'outlined');

    const renderLayout = () => {
      layout.textContent = JSON.stringify(bento.getLayout(), null, 2);
    };

    bento.addEventListener('bento-items-change', renderLayout);
    renderLayout();

    // Showcase runtime re-layout
    setTimeout(() => {
      bento.setItemSpan('#tileA', { colSpan: 3, rowSpan: 2 });
      bento.setItemSpan('#tileD', { colSpan: 9, rowSpan: 2 });
      renderLayout();
    }, 1400);
  </script>
</body>
</html>
